add_newline = true
command_timeout = 200
format = '''
[┌──\(](bold blue)$username[㉿](bold blue)$hostname[\)─](bold blue)$directory$git_branch
$character'''

[character]
success_symbol = '[└─\$ ](bold blue)'
error_symbol = '[└─\$ ](bold red)'

[username]
show_always = true
format = "[$user](bold red)"

[hostname]
ssh_only = false
format = "[$hostname](bold red)"

[directory]
truncation_length = 2
truncation_symbol = "…/"
style = "bold cyan"
format = '[\[](bold blue)[$path]($style)[\]](bold blue)'

[git_branch]
format = '[─\[](bold blue)[$branch]($style)[\]](bold blue)'
style = "italic cyan"

[git_status]
format     = '[─\[$all_status\]]($style)'
style      = "cyan"
ahead      = "+${count}"
diverged   = "±${ahead_count}-${behind_count}"
behind     = "-${count}"
conflicted = "="
up_to_date = ""
untracked  = "?"
modified   = "*"
stashed    = '\$'
staged     = "+"
renamed    = ""
deleted    = "x"

